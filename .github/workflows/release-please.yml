# Required release app settings:
# - vars.COMPONERE_RELEASE_APP_CLIENT_ID
# - secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY
# - protected-tag ruleset bypass for the release app, because this workflow
#   creates protected v* tags after the release PR is merged.
#
# Nothing is released here. Each run only opens or refreshes the release pull
# request, which carries the CHANGELOG.md entry and the version markers listed
# under `extra-files` in release-please-config.json (melange.yaml, apko.yaml).
# Merging that PR is what tags v* (`force-tag-creation`) and creates the DRAFT
# GitHub release (`draft`); release.yml then fills the draft, and a human
# publishes it.

name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

# One release branch and one release PR are rewritten per run, so overlapping
# runs would race on the same state. Queue them; never cancel one mid-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is deprecated by the action; `client-id` is the supported input.
          client-id: ${{ vars.COMPONERE_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
