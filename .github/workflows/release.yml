# Tag-triggered release. Every `uses:` reference and every
# `checksum-signing-workflow-ref` pins one reviewed meigma/release commit; that
# single revision is the release unit (reusable workflows, setup action, and the
# release-cli stamp). A mixed revision is not a supported state.
#
# Release Please owns the tag, the notes, and the initial draft. The jobs below
# build, verify, sign, and then publish: GitHub Release assets, the GHCR image,
# reviewed Homebrew and Scoop pull requests, and a native package publication
# request to componere/pkgs.
#
# Required settings (organization level, scoped to this repository):
# - vars.COMPONERE_RELEASE_APP_CLIENT_ID / secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY
# - secrets.MACOS_SIGN_P12, MACOS_SIGN_PASSWORD, MACOS_NOTARY_KEY,
#   MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID
# - secrets.RPM_SIGNING_KEY, RPM_SIGNING_PASSPHRASE, APK_SIGNING_KEY,
#   APK_SIGNING_PASSPHRASE (repository level)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-assets:
    name: Build release assets
    if: github.event.deleted == false
    permissions:
      attestations: read
      contents: read
      id-token: write
    uses: meigma/release/.github/workflows/go-pre-publish.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      sign-and-notarize-macos: true
      sign-native-packages: true
    secrets:
      macos-sign-p12: ${{ secrets.MACOS_SIGN_P12 }}
      macos-sign-password: ${{ secrets.MACOS_SIGN_PASSWORD }}
      macos-notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
      macos-notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      macos-notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      rpm-signing-key: ${{ secrets.RPM_SIGNING_KEY }}
      rpm-signing-passphrase: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
      apk-signing-key: ${{ secrets.APK_SIGNING_KEY }}
      apk-signing-passphrase: ${{ secrets.APK_SIGNING_PASSPHRASE }}

  oci-image:
    name: Build OCI image
    needs: release-assets
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: meigma/release/.github/workflows/go-oci-build.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      artifact-id: ${{ needs.release-assets.outputs.oci-input-artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.oci-input-artifact-digest }}

  oci-publish:
    name: Publish OCI image
    needs: oci-image
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: meigma/release/.github/workflows/publish-oci-image.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      artifact-id: ${{ needs.oci-image.outputs.artifact-id }}
      artifact-digest: ${{ needs.oci-image.outputs.artifact-digest }}
      image-digest: ${{ needs.oci-image.outputs.image-digest }}
      publish-image: false

  github-release:
    name: Publish GitHub Release
    needs:
      - release-assets
      - oci-publish
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: meigma/release/.github/workflows/publish-github-release.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      artifact-id: ${{ needs.release-assets.outputs.artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.artifact-digest }}
      checksum-signing-workflow-ref: meigma/release/.github/workflows/go-pre-publish.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
      require-oci-image: true
      oci-image-reference: ${{ needs.oci-publish.outputs.image-reference }}
      release-app-client-id: ${{ vars.COMPONERE_RELEASE_APP_CLIENT_ID }}
      publish-release: false
    secrets:
      release-app-private-key: ${{ secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY }}

  homebrew-publish:
    name: Open Homebrew tap pull request
    needs:
      - release-assets
      - github-release
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: meigma/release/.github/workflows/publish-homebrew.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      artifact-id: ${{ needs.release-assets.outputs.artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.artifact-digest }}
      checksum-signing-workflow-ref: meigma/release/.github/workflows/go-pre-publish.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
      tap: componere/homebrew-tap
      cask: incusos-builder
      release-app-client-id: ${{ vars.COMPONERE_RELEASE_APP_CLIENT_ID }}
      publish-homebrew: false
    secrets:
      release-app-private-key: ${{ secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY }}

  scoop-publish:
    name: Open Scoop bucket pull request
    needs:
      - release-assets
      - github-release
    permissions:
      actions: read
      attestations: read
      contents: read
    uses: meigma/release/.github/workflows/publish-scoop.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      artifact-id: ${{ needs.release-assets.outputs.artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.artifact-digest }}
      checksum-signing-workflow-ref: meigma/release/.github/workflows/go-pre-publish.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
      bucket: componere/scoop-bucket
      manifest: incusos-builder
      release-app-client-id: ${{ vars.COMPONERE_RELEASE_APP_CLIENT_ID }}
      publish-scoop: false
    secrets:
      release-app-private-key: ${{ secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY }}

  package-repository:
    name: Request package repository publication
    needs: github-release
    permissions: {}
    uses: meigma/release/.github/workflows/request-package-repository.yml@0dee66ff6c4cc7e28d7bb65e97a37d701e0eff4a
    with:
      package-repository-owner: componere
      package-repository-name: pkgs
      release-app-client-id: ${{ vars.COMPONERE_RELEASE_APP_CLIENT_ID }}
      publish-package-repository: false
    secrets:
      release-app-private-key: ${{ secrets.COMPONERE_RELEASE_APP_PRIVATE_KEY }}
