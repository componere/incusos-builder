# Temporary branch-only diagnostic. Triggered once by a push to
# feat/phase-5-e2e-boot. Harness and setup failures fail the job; a
# completed negative boot finding must succeed so the orchestrator can
# classify the evidence artifact. Not a merge gate.

name: Phase 5 boot probe

on:
  push:
    branches:
      - feat/phase-5-e2e-boot

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-probe:
    name: Linux boot acceptance probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Never auto-download a Go toolchain other than the mise-pinned one
      # (mise [env] is not carried by the action's shims, so set it on the job).
      GOTOOLCHAIN: local
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: true
          # Installs every tool from mise.toml honoring mise.lock (locked → fail
          # closed), including moon, and prepends the shim dir to PATH.

      - name: Install QEMU, firmware, TPM, and packet tools
        run: |
          set -euo pipefail
          echo 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            swtpm \
            swtpm-tools \
            tcpdump \
            tshark

      - name: Build CLI
        run: moon run :build --summary minimal

      - name: Run boot probe
        run: bash .github/scripts/phase5_boot_probe.sh

      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-boot-probe
          path: |
            ${{ github.workspace }}/.phase5-boot-probe/evidence.json
            ${{ github.workspace }}/.phase5-boot-probe/logs/
            ${{ github.workspace }}/.phase5-boot-probe/pcaps/
          if-no-files-found: error
          retention-days: 7
