name: Security Scan

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-vulnerability-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve scan metadata
        id: scan
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: true

      # melange packages an already-built binary; it compiles nothing. This
      # mirrors what `release-cli image build` does in the release, so the
      # scanned image has the same contents as a published one.
      - name: Build local scan image (melange + apko)
        env:
          COMMIT: ${{ steps.scan.outputs.commit }}
          DATE: ${{ steps.scan.outputs.date }}
        run: |
          set -euo pipefail
          work=".image-scan"
          rm -rf "$work" packages scan.tar
          mkdir -p "$work"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=0.0.0 -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o "$work/application" ./cmd/incusos-builder
          printf 'version: "0.0.0"\n' > "$work/vars.yaml"
          melange keygen melange.rsa
          melange build melange.yaml --arch x86_64 --runner docker \
            --signing-key melange.rsa --source-dir "$work" --vars-file "$work/vars.yaml"
          apko build apko.yaml incusos-builder:security-scan scan.tar \
            --arch amd64 --repository-append ./packages --keyring-append ./melange.rsa.pub
          docker load < scan.tar
          docker tag incusos-builder:security-scan-amd64 incusos-builder:security-scan

      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: incusos-builder:security-scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          hide-progress: true
          limit-severities-for-sarif: true

      - name: Upload scan results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: trivy-results.sarif
          category: container-vulnerability-scan
