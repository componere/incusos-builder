# This workflow rehearses the release paths without uploading GitHub release
# assets, pushing container images, signing, or attesting. It is intended for
# release PRs and manual checks before changing release automation.
#
# Fidelity rule: every step here runs the same command the real release runs,
# against a synthetic version, and stops short only of the publishing calls
# (`gh release upload`, `apko publish`, `cosign sign`, and the attest.yml
# provenance job). Do not reimplement release logic here; invoke it.
#
# Keep the pull_request trigger broad so required check contexts still report
# on normal PRs. The jobs intentionally skip unless the PR head branch is a
# Release Please branch, which avoids spending runner time on routine changes.

name: Release Dry Run

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary-release-dry-run:
    name: Binary Release Dry Run
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DRY_RUN_TAG: v0.0.0-dryrun.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Create synthetic release tag
        run: git tag -f "$DRY_RUN_TAG"

      - name: Run GoReleaser without publishing
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.DRY_RUN_TAG }}

      - name: Stage and validate ghd release assets
        run: |
          set -euo pipefail

          # The real release runs this exact script, so ghd asset mapping, SBOM
          # coverage, executable bits, and checksum integrity are rehearsed
          # here instead of being discovered mid-release.
          python3 .github/scripts/stage_ghd_release_assets.py --tag "$DRY_RUN_TAG"

          # The script asserts ghd.toml points provenance at the isolated
          # attest workflow; confirm that workflow still exists under that path.
          test -f .github/workflows/attest.yml

      - name: Smoke test dry-run binary
        run: |
          set -euo pipefail

          version="${DRY_RUN_TAG#v}"
          binary_name="incusos-builder"
          host_os="$(go env GOHOSTOS)"
          host_arch="$(go env GOHOSTARCH)"
          bin="dist/release-assets/${binary_name}_${version}_${host_os}_${host_arch}"

          if [ ! -x "$bin" ]; then
            echo "failed to locate executable host binary artifact $bin" >&2
            find dist/release-assets -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

          output="$("$bin" --version)"
          printf '%s\n' "$output"

          case "$output" in
            "$binary_name $version "*) ;;
            *) echo "unexpected version output: $output" >&2; exit 1 ;;
          esac

  # Rehearse the container build: build per-arch signed apks on native runners and
  # assemble the image with apko, WITHOUT pushing, cosign-signing, or attesting.
  melange-build-dry-run:
    name: Melange Build Dry Run (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            apkdir: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            apkdir: aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: true

      - name: Resolve dry-run metadata
        id: dry-run
        env:
          DRY_RUN_VERSION: 0.0.0-dryrun.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "version=${DRY_RUN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write melange vars file
        env:
          VERSION: ${{ steps.dry-run.outputs.version }}
          COMMIT: ${{ steps.dry-run.outputs.commit }}
          DATE: ${{ steps.dry-run.outputs.date }}
        run: |
          printf 'version: "%s"\ncommit: "%s"\ndate: "%s"\n' "$VERSION" "$COMMIT" "$DATE" > melange-vars.yaml

      - name: Generate ephemeral signing key
        run: melange keygen "melange-${{ matrix.arch }}.rsa"

      - name: Build signed apk
        run: |
          melange build melange.yaml \
            --arch ${{ matrix.arch }} \
            --runner docker \
            --signing-key "melange-${{ matrix.arch }}.rsa" \
            --source-dir . \
            --vars-file melange-vars.yaml

      - name: Upload apk and public key
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ matrix.arch }}
          path: |
            packages/${{ matrix.apkdir }}/**
            melange-${{ matrix.arch }}.rsa.pub
          if-no-files-found: error
          retention-days: 1

  container-image-dry-run:
    name: Container Image Dry Run
    needs:
      - melange-build-dry-run
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DRY_RUN_VERSION: 0.0.0-dryrun.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: Check melange dry-run result
        env:
          MELANGE_RESULT: ${{ needs.melange-build-dry-run.result }}
        run: |
          set -euo pipefail

          if [ "$MELANGE_RESULT" != "success" ]; then
            echo "melange dry-run result was $MELANGE_RESULT" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Download per-arch apks and public keys
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apk-*
          path: .
          merge-multiple: true

      - name: Assemble multi-arch image (no push)
        run: |
          set -euo pipefail

          # apko moves generated SBOMs into --sbom-path but never creates the
          # directory; the release depends on this mkdir, so rehearse it too.
          mkdir -p sbom

          # Both arches, exactly as the release publishes them, so each per-arch
          # apk is actually installed and signature-checked against its own key.
          apko build apko.yaml incusos-builder:dry-run image.tar \
            --arch amd64,arm64 \
            --keyring-append ./melange-amd64.rsa.pub \
            --keyring-append ./melange-arm64.rsa.pub \
            --sbom-path ./sbom

          if [ -z "$(find sbom -type f -print -quit)" ]; then
            echo "apko produced no SBOMs under ./sbom" >&2
            exit 1
          fi

          docker load < image.tar

      - name: Verify image architectures
        run: |
          set -euo pipefail

          # apko writes one docker-loadable image per arch, tagged <tag>-<arch>.
          # The release asserts platforms on the pushed index with `imagetools
          # inspect`; a dry run cannot push, so assert the loaded images here.
          for arch in amd64 arm64; do
            actual="$(docker image inspect "incusos-builder:dry-run-${arch}" --format '{{.Os}}/{{.Architecture}}')"
            if [ "$actual" != "linux/${arch}" ]; then
              echo "expected linux/${arch}, got ${actual}" >&2
              exit 1
            fi
          done

      - name: Smoke test dry-run image
        run: |
          set -euo pipefail

          # The runner is amd64, so only that image can execute here.
          docker tag incusos-builder:dry-run-amd64 incusos-builder:dry-run

          output="$(docker run --rm incusos-builder:dry-run --version)"
          printf '%s\n' "$output"

          # Proves the apko entrypoint runs and that melange stamped the version
          # through --vars-file instead of the melange.yaml default.
          case "$output" in
            "incusos-builder $DRY_RUN_VERSION "*) ;;
            *) echo "unexpected container version output: $output" >&2; exit 1 ;;
          esac

          # apko `run-as: 65532` becomes the OCI config user; a root image here
          # would be a silent regression of the nonroot posture.
          image_user="$(docker image inspect incusos-builder:dry-run --format '{{.Config.User}}')"
          if [ "$image_user" != "65532" ]; then
            echo "expected image to run as uid 65532, got '${image_user}'" >&2
            exit 1
          fi

      - name: Generate image SBOM (no attestation)
        run: |
          set -euo pipefail

          # The release attests this SBOM with actions/attest-sbom. Attesting is
          # a publishing act, so the rehearsal only proves syft can describe the
          # assembled image.
          syft docker:incusos-builder:dry-run -o spdx-json=image.spdx.json
          jq -e '.packages | length > 0' image.spdx.json > /dev/null
