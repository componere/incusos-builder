# Moon workspace configuration: project sources, VCS settings, and pipeline
# defaults. Projects are listed explicitly; uncomment the discovery globs below
# to pick up apps, packages, services, or tools.

projects:
  globs: []
  sources:
    root: '.'
    docs: 'docs'

  # Uncomment to auto-discover more projects.
  # globs:
  #   - 'apps/*'
  #   - 'packages/*'
  #   - 'services/*'
  #   - 'tools/*'
  #   - 'crates/*'
  #   - 'cmd/*'
  #   - 'sdk/*'
  #
  # Uncomment if glob-discovered IDs are likely to collide.
  # globFormat: 'source-path'

defaultProject: 'root'

vcs:
  defaultBranch: 'master'
  provider: 'github'

pipeline:
  installDependencies: false

# Uncomment to aggregate project owners into CODEOWNERS.
# codeowners:
#   sync: true

# Uncomment to enforce project boundaries once projects are tagged and layered.
