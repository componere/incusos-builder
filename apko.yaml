# Minimal, multi-arch, nonroot runtime image assembled from the melange-built
# incusos-builder apk plus a small Wolfi base. Matches the
# gcr.io/distroless/static-debian12:nonroot posture (uid 65532, ca-certs,
# tzdata, no shell).
#
# `release-cli image build` appends the local apk repository and its ephemeral
# per-architecture signing key, so this file names the package plainly and
# never references a local repository or keyring.
#
# The image version and revision annotations are injected from the release tag
# and the tagged commit; do not hardcode them here. The image verifier compares
# both against the release it is building.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - incusos-builder

entrypoint:
  command: /usr/bin/incusos-builder

# Create the nonroot user/group (uid/gid 65532) and run as it — Wolfi has no
# `nonroot` package; the user is defined here, mirroring distroless:nonroot.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: incusos-builder
  org.opencontainers.image.description: Build seeded IncusOS installation media from a YAML config
  org.opencontainers.image.source: https://github.com/componere/incusos-builder
  org.opencontainers.image.licenses: Apache-2.0 OR MIT
