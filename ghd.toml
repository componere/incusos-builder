version = 1

# Release assets are attested by the shared publisher in the pinned
# meigma/release unit, not by a workflow in this repository.
[provenance]
signer_workflow = "meigma/release/.github/workflows/publish-github-release.yml"

[[packages]]
name = "incusos-builder"
description = "Build seeded IncusOS installation media from a YAML config"
tag_pattern = "v${version}"

[[packages.assets]]
os = "darwin"
arch = "amd64"
pattern = "incusos-builder_${version}_darwin_amd64.tar.gz"

[[packages.assets]]
os = "darwin"
arch = "arm64"
pattern = "incusos-builder_${version}_darwin_arm64.tar.gz"

[[packages.assets]]
os = "linux"
arch = "amd64"
pattern = "incusos-builder_${version}_linux_amd64.tar.gz"

[[packages.assets]]
os = "linux"
arch = "arm64"
pattern = "incusos-builder_${version}_linux_arm64.tar.gz"

[[packages.assets]]
os = "windows"
arch = "amd64"
pattern = "incusos-builder_${version}_windows_amd64.zip"

[[packages.assets]]
os = "windows"
arch = "arm64"
pattern = "incusos-builder_${version}_windows_arm64.zip"

[[packages.binaries]]
path = "incusos-builder"
