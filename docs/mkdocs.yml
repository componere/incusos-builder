site_name: incusos-builder
site_description: Build seeded IncusOS installation media from a YAML config
site_url: https://componere.github.io/incusos-builder/
repo_name: componere/incusos-builder
repo_url: https://github.com/componere/incusos-builder
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorials:
      - Build your first seeded ISO: tutorials/first-seeded-iso.md
  - How-to guides:
      - Encrypt secrets with SOPS: how-to/sops-encryption.md
      - Build offline media: how-to/build-offline-media.md
      - Run in CI: how-to/run-in-ci.md
      - Use a local mirror: how-to/use-local-mirror.md
      - Recover an interrupted build: how-to/recover-interrupted-build.md
      - Verify boot acceptance: how-to/verify-boot-acceptance.md
  - Reference:
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - Automation: reference/automation.md
      - Cache: reference/cache.md
  - Explanation:
      - Trust model: explanation/trust-model.md
      - Seed injection: explanation/seed-injection.md
      - Upstream version coupling: explanation/upstream-version-coupling.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/palette.css
