# Packages the canonical Linux binary that GoReleaser already staged into a
# Wolfi apk; apko.yaml then assembles it into the minimal multi-arch runtime
# image.
#
# This configuration compiles nothing. `release-cli image build` stages the
# reviewed binary as `application` in each per-architecture source tree and
# writes the release version into a vars file, so the image and the GitHub
# Release assets are the same bytes. Do not reintroduce a `go/build` pipeline:
# that would produce a second, unattested binary.
package:
  name: incusos-builder
  version: ${{vars.version}}
  epoch: 0
  description: Build seeded IncusOS installation media from a YAML config
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: Apache-2.0 OR MIT

# Overridden at build time by the vars file the CLI writes from the release tag.
vars:
  version: 0.0.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm755 -o 0 -g 0 application "${{targets.destdir}}/usr/bin/incusos-builder"
