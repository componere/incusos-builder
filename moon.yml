language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'incusos-builder'
  description: 'Build seeded IncusOS installation media from a YAML config'
  owner: 'componere'
  maintainers:
    - 'componere'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - '.goreleaser.yaml'
    - 'ghd.toml'
    - 'release-please-config.json'
    - '.release-please-manifest.json'
    - '.github/workflows.disabled/**/*.yml'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'golangci-lint run --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build -o bin/incusos-builder ./cmd/incusos-builder'
    inputs:
      - '@group(goSources)'
    outputs:
      - 'bin/incusos-builder'

  test:
    command: 'go test ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Type-only upstream gate: incus-osd is imported for its API type declarations,
  # so no package from its `internal/` or `cmd/` trees may reach our build closure
  # (docs/notes/spike-1d-types.md). Scoped deny assertion, not a package count.
  check-upstream:
    script: 'python3 -m unittest discover -s .github/scripts -p test_check_upstream_closure.py && python3 .github/scripts/check_upstream_closure.py'
    inputs:
      - '@group(goSources)'
      - '.github/scripts/check_upstream_closure.py'
      - '.github/scripts/test_check_upstream_closure.py'
    options:
      cache: false

  # Regenerate the testify mocks declared in .mockery.yml. Codegen is a local task:
  # CI verifies the committed mocks by compiling and testing against them.
  mocks:
    command: 'mockery'
    inputs:
      - '@group(goSources)'
      - '.mockery.yml'
    options:
      cache: false
      runInCI: false

  # Live T3 suite against the default HTTPS update server. Opt-in only:
  # ordinary `moon run root:check` / CI must not download multi-GB images.
  e2e:
    command: 'go test ./internal/cli -run TestLive -count 1'
    env:
      INCUSOS_BUILDER_E2E: '1'
    inputs:
      - '@group(goSources)'
    options:
      cache: false
      runInCI: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:check-upstream'
      - 'docs:build'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
    options:
      cache: false
      runInCI: true
